# ------------------------------------------------------------------------
# Serving the static build of Dragon's Shrine.
#
# Three things here are load-bearing and easy to undo by accident:
#
#   - the split cache policy. Everything under /_next/static carries a content
#     hash in its filename, so it can be cached forever; the HTML that points
#     at those filenames must never be cached, or a deploy leaves browsers
#     asking for chunks that no longer exist.
#
#   - .webmanifest's MIME type, which nginx does not know natively. Without it
#     the manifest is served as text/plain and iOS quietly declines to install
#     the game to the home screen.
#
#   - the repeated security headers. `add_header` does NOT accumulate down the
#     tree: the moment a location sets one of its own, every add_header from
#     the server block above it stops applying to that location. So the common
#     set is repeated in each location rather than declared once -- which looks
#     redundant and is not. Removing the copies silently strips the headers.
# ------------------------------------------------------------------------

types {
  application/manifest+json  webmanifest;
}

server {
  listen      80;
  listen      [::]:80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Everything here is code and fonts -- the artwork is SVG drawn at runtime,
  # so the whole game is text and compresses hard. `gzip_static` serves the
  # .gz files the image build already produced instead of recompressing on
  # every request; `gzip` covers anything the build skipped.
  gzip              on;
  gzip_static       on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    application/manifest+json application/wasm
    image/svg+xml;

  # Nothing here is framed, embedded cross-origin, or interested in being
  # sniffed. See the note above about why these are repeated below.
  add_header X-Content-Type-Options nosniff     always;
  add_header X-Frame-Options        SAMEORIGIN  always;
  add_header Referrer-Policy        same-origin always;

  # A target for the container healthcheck that does not drag in the app.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output: the filename changes whenever the contents do, so it
  # can be cached for a year and never revalidated.
  location /_next/static/ {
    access_log off;
    add_header X-Content-Type-Options nosniff     always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        same-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Fonts are hashed the same way but can be reached outside /_next/static.
  location ~* \.(?:woff2?|ttf|otf)$ {
    access_log off;
    add_header X-Content-Type-Options nosniff     always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        same-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The manifest and the icons change rarely but must not go stale for a year,
  # or a re-installed home-screen app keeps the old name and artwork.
  location ~* ^/(?:manifest\.webmanifest|icons/|favicon\.ico|apple-touch-icon\.png) {
    add_header X-Content-Type-Options nosniff     always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        same-origin always;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # The pages themselves. `output: 'export'` with `trailingSlash` writes each
  # route as <route>/index.html, which is what the second and third candidates
  # resolve. A genuine miss ends in `=404` so that the 404 page is served with
  # a 404 status rather than a 200 -- pointing try_files at the file directly
  # would return "not found" as a success, which browsers and crawlers cache.
  location / {
    add_header X-Content-Type-Options nosniff     always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        same-origin always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header X-Content-Type-Options nosniff     always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        same-origin always;
    add_header Cache-Control "no-cache" always;
  }
}
