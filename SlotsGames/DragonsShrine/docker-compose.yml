# Dragon's Shrine, packaged.
#
#   docker compose up -d --build     build and run
#   docker compose logs -f           watch it
#   docker compose down              stop it
#
# The game then answers on http://localhost:8081, and on http://<this
# machine's LAN IP>:8081 from any phone or laptop on the same network.

services:
  dragons-shrine:
    build:
      context: .
      dockerfile: Dockerfile
    image: dragons-shrine:latest
    container_name: dragons-shrine
    restart: unless-stopped
    ports:
      # Host 8081 rather than 8080, so this and the craps table can run side by
      # side on one machine. Change the left number freely.
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # The container serves files and holds no state, so it has no business
    # writing to its own filesystem outside of nginx's scratch directories.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
