# The whole arcade, in one place.
#
#   docker compose up -d --build     build and run every game
#   docker compose logs -f           watch them
#   docker compose ps                what is up, and is it healthy
#   docker compose down              stop them
#
# Craps answers on http://localhost:8080, Dragon's Shrine on
# http://localhost:8081, Blackjack on http://localhost:8082 and Three Card
# Poker on http://localhost:8083.
#
# ---------------------------------------------------------------------------
# Why this file is nothing but a list
#
# Each game already describes how it is built and run, in a compose file next
# to its own Dockerfile, because each one has to stand on its own: a game is
# developed, built and play-tested from its own folder long before it is worth
# starting the whole arcade. This file used to *repeat* all four of those
# definitions so the stack could start them together, which meant every port,
# health check and hardening flag existed in two places and was one edit away
# from disagreeing — and a service that drifts here fails only when someone
# starts the arcade the other way, which is the last thing anybody tries.
#
# `include` removes the second copy. Each game is defined exactly once, in its
# own folder, and the arcade is the list of games in it. Relative paths inside
# an included file resolve against that file's own directory, so each build
# context stays `.` and keeps working from either end.
#
# The other half of the fix is `name`, below, which is repeated in all four
# game files. A compose project is named for the directory it was started from
# unless it says otherwise, so starting a game from its own folder used to
# build a *second* project that wanted the same container name as this one —
# and Docker refuses, with an error about a name already in use that says
# nothing about which of the two ways you started it. Pinning the same project
# name everywhere means both ways are the same stack: starting a game from its
# folder now joins this one and updates that service in place, and `ps` from
# the root lists it whichever way it was started.
# ---------------------------------------------------------------------------

name: knotzcrapzncardz

include:
  # Table games
  - path: TableGames/craps/docker-compose.yml
  - path: TableGames/blackjack/docker-compose.yml
  - path: TableGames/three-card-poker/docker-compose.yml
  # Slots
  - path: SlotsGames/DragonsShrine/docker-compose.yml
